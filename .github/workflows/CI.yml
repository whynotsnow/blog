name: snow build CI

on:
    push:
        branches: [dev_snow] # 监听 dev_snow 分支
    pull_request:
        branches: [dev_snow]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # 🚨 Step 1: Astro Check
    check:
        name: Astro Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            # 🔹 缓存 pnpm 依赖，提高构建速度
            - name: Cache pnpm store
              uses: actions/cache@v3
              with:
                  path: ~/.pnpm-store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Astro Check
              run: pnpm astro check

    # 🏗️ Step 2: Astro Build
    build:
        name: Astro Build
        runs-on: ubuntu-latest
        needs: check # 依赖 check job 成功
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            # 🔹 缓存 pnpm 依赖，提高构建速度
            - name: Cache pnpm store
              uses: actions/cache@v3
              with:
                  path: ~/.pnpm-store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Astro Build
              run: pnpm astro build

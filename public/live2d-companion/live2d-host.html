<!doctype html>
<html>
	<head>
		<style>
			:root {
				--live2d-companion-control-surface: rgb(255 255 255 / 88%);
				--live2d-companion-message-surface: rgb(255 255 255 / 90%);
				--live2d-companion-surface-hover: rgb(255 255 255 / 96%);
				--live2d-companion-text: rgba(24, 24, 24, 0.9);
				--live2d-companion-border: rgba(24, 24, 24, 0.1);
				--live2d-companion-accent: rgba(120, 120, 120, 0.9);
				--live2d-companion-shadow: 0 8px 24px rgb(0 0 0 / 10%);
				--live2d-companion-message-top: 32px;
			}
			* {
				margin: 0;
				padding: 0;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			canvas,
			body
				> div:not(#live2d-companion-message):not(
					#live2d-companion-drag-indicator
				) {
				background: transparent !important;
			}
			.live2d-companion-message {
				position: absolute;
				left: 50%;
				top: var(--live2d-companion-message-top);
				z-index: 10000;
				box-sizing: border-box;
				width: max-content;
				max-width: calc(100% - 24px);
				max-height: min(108px, calc(100% - 48px));
				overflow-y: auto;
				padding: 8px 12px;
				border: 1px solid var(--live2d-companion-border);
				border-radius: 8px;
				background: var(--live2d-companion-message-surface);
				box-shadow: var(--live2d-companion-shadow);
				color: var(--live2d-companion-text);
				font:
					13px/1.5 system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
				text-align: left;
				pointer-events: none;
				opacity: 0;
				transform: translate(-50%, 6px);
				backdrop-filter: blur(12px);
				transition:
					opacity 0.18s ease,
					transform 0.18s ease;
			}
			.live2d-companion-message,
			.live2d-companion-widget-tip {
				overflow-wrap: anywhere;
				hyphens: auto;
			}
			.live2d-companion-message.is-visible {
				opacity: 1;
				transform: translate(-50%, 0);
			}
			.live2d-companion-widget-tip {
				box-sizing: border-box !important;
				width: max-content !important;
				max-width: min(232px, calc(100vw - 32px)) !important;
				padding: 8px 12px !important;
				border: 1px solid var(--live2d-companion-border) !important;
				border-radius: 8px !important;
				background: var(--live2d-companion-message-surface) !important;
				box-shadow: var(--live2d-companion-shadow) !important;
				color: var(--live2d-companion-text) !important;
				font:
					13px/1.5 system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif !important;
				text-align: left !important;
				white-space: normal !important;
				backdrop-filter: blur(12px);
			}
			.live2d-companion-widget-tip span {
				display: block;
			}
			.live2d-companion-widget-tip-caret {
				border-top-color: var(
					--live2d-companion-message-surface
				) !important;
			}
			.live2d-companion-collapse,
			.live2d-companion-menu-button {
				display: flex;
				width: 24px;
				height: 24px;
				align-items: center;
				justify-content: center;
				padding: 0;
				border: 1px solid var(--live2d-companion-border);
				border-radius: 999px;
				background: var(--live2d-companion-control-surface);
				box-shadow: var(--live2d-companion-shadow);
				color: var(--live2d-companion-text);
				font:
					700 16px/1 system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
				cursor: pointer;
				flex-shrink: 0;
				position: relative;
				z-index: 10002;
				backdrop-filter: blur(12px);
				transition:
					background 0.15s ease,
					box-shadow 0.15s ease,
					color 0.15s ease;
			}
			.live2d-companion-collapse svg,
			.live2d-companion-menu-button svg {
				width: 0.9rem;
				height: 0.9rem;
				pointer-events: none;
			}
			.live2d-companion-collapse:hover,
			.live2d-companion-menu-button:hover,
			.live2d-companion-menu-button.is-active {
				background: var(--live2d-companion-surface-hover);
				box-shadow:
					var(--live2d-companion-shadow),
					0 0 0 3px
						color-mix(
							in srgb,
							var(--live2d-companion-accent) 12%,
							transparent
						);
				color: var(--live2d-companion-accent);
			}
			.live2d-companion-menu {
				top: 14px !important;
				bottom: auto !important;
				transform: none !important;
			}
			body.live2d-companion-expression-panel-open .live2d-companion-menu {
				opacity: 1 !important;
				pointer-events: auto !important;
			}
			body.live2d-companion-pointer-inside .live2d-companion-menu {
				opacity: 1 !important;
				pointer-events: auto !important;
			}
			body.live2d-companion-theme-dark {
				color-scheme: dark;
			}
			body.live2d-companion-drag-ready {
				cursor: grab;
			}
			body.live2d-companion-dragging {
				cursor: grabbing;
				user-select: none;
			}
			body.live2d-companion-drag-ready canvas,
			body.live2d-companion-dragging canvas {
				cursor: inherit !important;
			}
			.live2d-companion-drag-indicator {
				position: absolute;
				right: 12px;
				top: 12px;
				z-index: 10003;
				display: flex;
				width: 28px;
				height: 28px;
				align-items: center;
				justify-content: center;
				border: 1px solid var(--live2d-companion-border);
				border-radius: 999px;
				background: var(--live2d-companion-control-surface);
				box-shadow: var(--live2d-companion-shadow);
				color: var(--live2d-companion-accent);
				opacity: 0;
				pointer-events: none;
				transform: translateY(4px) scale(0.92);
				backdrop-filter: blur(12px);
				transition:
					opacity 0.16s ease,
					transform 0.16s ease;
			}
			.live2d-companion-drag-indicator svg {
				width: 1rem;
				height: 1rem;
			}
			body.live2d-companion-drag-ready .live2d-companion-drag-indicator,
			body.live2d-companion-dragging .live2d-companion-drag-indicator {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		</style>

			}

			function getIdlePlaybackPool() {
				var settings = getActiveIdlePlayback();
				if (settings.enable !== true) return [];
				var available = getAvailableExpressions();
				if (!available.length) return [];

				var configuredExpressions = Array.isArray(settings.expressions)
					? settings.expressions
					: [];
				var menu = getActiveExpressionMenu();
				var names = [];

				if (configuredExpressions.length) {
					names = configuredExpressions;
				} else {
					if (settings.includeActions !== false) {
						names = names.concat(
							(menu.shortcuts || [])
								.slice(0, menu.maxActions)
								.map(function (item) {
									return item.name;
								}),
						);
					}
					if (settings.includePanel === true && menu.enablePanel) {
						names = names.concat(
							available.slice(0, menu.maxPanelItems),
						);
					}
				}

				return uniqueNames(names).filter(function (name) {
					return available.indexOf(name) !== -1;
				});
			}

			function getIdlePlaybackInterval() {
				var settings = getActiveIdlePlayback();
				var interval = Number(settings.interval);
				if (!Number.isFinite(interval) || interval < 10000) {
					return 45000;
				}
				return interval;
			}

			function isCompanionInteractionActive() {
				return (
					pointerInsideCompanion ||
					expressionPanelOpen ||
					dragReady ||
					dragging
				);
			}

			function setPointerInsideCompanion(nextInside) {
				pointerInsideCompanion = Boolean(nextInside);
				document.body.classList.toggle(
					"live2d-companion-pointer-inside",
					pointerInsideCompanion,
				);
			}

			function ensureDragIndicator() {
				var indicator = document.getElementById(
					"live2d-companion-drag-indicator",
				);
				if (indicator) return indicator;
				indicator = document.createElement("div");
				indicator.id = "live2d-companion-drag-indicator";
				indicator.className = "live2d-companion-drag-indicator";
				indicator.setAttribute("aria-hidden", "true");
				indicator.innerHTML = getLocalIcon(
					live2dCompanionUi.dragIndicatorIcon ||
						"local:move-four-way",
				);
				document.body.appendChild(indicator);
				return indicator;
			}

			function postDragReady() {
				parent.postMessage(
					{
						type: "l2d-drag-ready",
						ready: dragReady,
					},
					"*",
				);
			}

			function setDragReady(nextReady) {
				dragReady = Boolean(nextReady);
				document.body.classList.toggle(
					"live2d-companion-drag-ready",
					dragReady,
				);
				if (dragReady) ensureDragIndicator();
				postDragReady();
			}

			function clearDragHoverTimer() {
				if (!dragHoverTimer) return;
				clearTimeout(dragHoverTimer);
				dragHoverTimer = null;
			}

			function scheduleDragReady() {
				clearDragHoverTimer();
				if (dragging || expressionPanelOpen) return;
				dragHoverTimer = setTimeout(function () {
					setDragReady(true);
				}, dragHoverDelay);
			}

			function resetDragReady() {
				clearDragHoverTimer();
				if (!dragging) setDragReady(false);
			}

			function pointFromPointerEvent(event) {
				return {
					x: event.clientX,
					y: event.clientY,
					pointerId: event.pointerId,
				};
			}

			function isNativeControlTarget(target) {
				return (
					target &&
					target.closest &&
					target.closest(
						"button, a, input, textarea, select, [role='button']",
					)
				);
			}

			function postDragEvent(type, event) {
				parent.postMessage(
					{
						type: type,
						point: pointFromPointerEvent(event),
					},
					"*",
				);
			}

			function startDrag(event) {
				if (!dragReady || event.button !== 0) return;
				if (isNativeControlTarget(event.target)) return;
				dragging = true;
				clearDragHoverTimer();
				document.body.classList.add("live2d-companion-dragging");
				ensureDragIndicator();
				if (event.target && event.target.setPointerCapture) {
					try {
						event.target.setPointerCapture(event.pointerId);
					} catch (err) {
						console.warn("Failed to capture drag pointer:", err);
					}
				}
				event.preventDefault();
				event.stopPropagation();
				postDragEvent("l2d-drag-start", event);
			}

			function updateDrag(event) {
				if (!dragging) return;
				event.preventDefault();
				event.stopPropagation();
				postDragEvent("l2d-drag-move", event);
			}

			function endDrag(event) {
				if (!dragging) return;
				dragging = false;
				document.body.classList.remove("live2d-companion-dragging");
				event.preventDefault();
				event.stopPropagation();
				parent.postMessage({ type: "l2d-drag-end" }, "*");
				setDragReady(pointerInsideCompanion);
			}

			function pickIdlePlaybackExpression(pool) {
				if (pool.length === 1) return pool[0];
				var candidates = pool.filter(function (name) {
					return name !== lastIdlePlaybackExpression;
				});
				var targetPool = candidates.length ? candidates : pool;
				return targetPool[
					Math.floor(Math.random() * targetPool.length)
				];
			}

			function stopIdlePlayback() {
				if (idlePlaybackTimer) {
					clearTimeout(idlePlaybackTimer);
					idlePlaybackTimer = null;
				}
			}

			function scheduleIdlePlayback() {
				stopIdlePlayback();
				var pool = getIdlePlaybackPool();
				if (!pool.length) return;
				idlePlaybackTimer = setTimeout(function () {
					var nextPool = getIdlePlaybackPool();
					if (
						nextPool.length &&
						!isCompanionInteractionActive() &&
						widgetInstance &&
						widgetInstance.l2d
					) {
						var expression = pickIdlePlaybackExpression(nextPool);
						setCompanionExpression(expression, {
							resetIdleTimer: false,
						});
						lastIdlePlaybackExpression = expression;
					}
					scheduleIdlePlayback();
				}, getIdlePlaybackInterval());
			}

			document.addEventListener("pointerenter", function () {
				setPointerInsideCompanion(true);
				scheduleDragReady();
			});

			document.addEventListener("pointerleave", function () {
				setPointerInsideCompanion(false);
				resetDragReady();
			});

			document.addEventListener("pointerdown", startDrag, true);
			document.addEventListener("pointermove", updateDrag, true);
			document.addEventListener("pointerup", endDrag, true);
			document.addEventListener("pointercancel", endDrag, true);

			function getAvailableExpressions() {
				return availableExpressionsCache;
			}

			function refreshAvailableExpressions() {
				if (
					!expressionsReady ||
					!widgetInstance ||
					!widgetInstance.l2d
				) {
					availableExpressionsCache = [];
					return availableExpressionsCache;
				}
				availableExpressionsCache =
					widgetInstance.l2d.getExpressions() || [];
				return availableExpressionsCache;
			}

			function createMenuButton(id, label, icon, onClick) {
				var button = document.getElementById(id);
				if (!button) {
					button = document.createElement("button");
					button.id = id;
					button.className = "live2d-companion-menu-button";
					button.type = "button";
					button.addEventListener("click", onClick);
				}
				button.title = label;
				button.setAttribute("aria-label", label);
				button.setAttribute("data-local-icon", icon);
				button.innerHTML = getLocalIcon(icon);
				return button;
			}

			async function switchCompanionModel() {
				if (!lastInitConfig) return;
				var models = getModelList(lastInitConfig);
				if (models.length <= 1) return;
				currentModelIndex = (currentModelIndex + 1) % models.length;
				lastIdlePlaybackExpression = "";
				saveModelIndex(currentModelIndex);
				postActiveModelState();
				requestCloseExpressionPanel();
				if (widgetInstance && widgetInstance.switchModel) {
					modelLoaded = false;
					expressionsReady = false;
					availableExpressionsCache = [];
					await widgetInstance.switchModel(currentModelIndex);
					modelLoaded = true;
					setCompanionParameters(
						getActiveDefaultParameters(lastInitConfig),
					);
					await waitForRenderFrames(2);
					expressionsReady = true;
					refreshAvailableExpressions();
					mountCompanionControls();
					postAvailableExpressions();
					scheduleIdlePlayback();
					notifyLoaded();
				}
			}

			function mountModelSwitchButton(menu) {
				var models = getModelList(lastInitConfig);
				var existing = document.getElementById(
					"live2d-companion-model-switch",
				);
				if (models.length <= 1) {
					if (existing) existing.remove();
					return;
				}
				var settings = lastInitConfig._modelSwitch || {};
				var button = createMenuButton(
					"live2d-companion-model-switch",
					settings.label || "切换模型",
					settings.icon ||
						"material-symbols:view-carousel-outline-rounded",
					switchCompanionModel,
				);
				if (button.parentElement !== menu) menu.appendChild(button);
			}

			function hideExpressionPanel() {
				var button = document.getElementById(
					"live2d-companion-expression-panel-toggle",
				);
				if (button) button.classList.remove("is-active");
			}

			function requestCloseExpressionPanel() {
				hideExpressionPanel();
				parent.postMessage(
					{
						type: "l2d-action",
						action: "closeExpressionPanel",
					},
					"*",
				);
			}

			function syncExpressionPanelState(open) {
				expressionPanelOpen = Boolean(open);
				if (expressionPanelOpen) resetDragReady();
				document.body.classList.toggle(
					"live2d-companion-expression-panel-open",
					expressionPanelOpen,
				);
				var button = document.getElementById(
					"live2d-companion-expression-panel-toggle",
				);
				if (button) {
					button.classList.toggle("is-active", expressionPanelOpen);
				}
				var menu = document.querySelector(".live2d-companion-menu");
				if (!menu) return;
				if (expressionPanelOpen) {
					menu.style.setProperty("opacity", "1", "important");
					menu.style.setProperty(
						"pointer-events",
						"auto",
						"important",
					);
				} else {
					menu.style.setProperty("opacity", "0");
					menu.style.setProperty("pointer-events", "none");
				}
			}

			function getExpressionLabel(name) {
				var menu = getActiveExpressionMenu();
				var labels = menu.labels || {};
				if (labels[name]) return labels[name];
				var shortcuts = menu.shortcuts || [];
				var shortcut = shortcuts.find(function (item) {
					return item.name === name;
				});
				return (shortcut && shortcut.label) || name;
			}

			function postAvailableExpressions() {
				var menu = getActiveExpressionMenu();
				var expressions = refreshAvailableExpressions();
				parent.postMessage(
					{
						type: "l2d-expressions",
						expressions: expressions.slice(0, menu.maxPanelItems),
					},
					"*",
				);
			}

			function toggleExpressionPanel() {
				if (!getAvailableExpressions().length) return;
				var button = document.getElementById(
					"live2d-companion-expression-panel-toggle",
				);
				var rect = button && button.getBoundingClientRect();
				parent.postMessage(
					{
						type: "l2d-action",
						action: "toggleExpressionPanel",
						anchor: rect
							? {
									x: rect.right,
									y: rect.top,
								}
							: undefined,
					},
					"*",
				);
			}

			function mountExpressionButtons(menu) {
				Array.prototype.forEach.call(
					document.querySelectorAll(
						".live2d-companion-expression-shortcut",
					),
					function (button) {
						button.remove();
					},
				);
				var panelToggle = document.getElementById(
					"live2d-companion-expression-panel-toggle",
				);
				var expressions = getAvailableExpressions();
				if (!expressions.length) {
					if (panelToggle) panelToggle.remove();
					hideExpressionPanel();
					return;
				}
				var menuConfig = getActiveExpressionMenu();
				if (menuConfig.enablePanel) {
					var button = createMenuButton(
						"live2d-companion-expression-panel-toggle",
						menuConfig.panelLabel || "全部表情",
						menuConfig.panelIcon ||
							"material-symbols:grid-view-rounded",
						toggleExpressionPanel,
					);
					if (button.parentElement !== menu) menu.appendChild(button);
				} else {
					if (panelToggle) panelToggle.remove();
					hideExpressionPanel();
				}
				var shortcuts = (menuConfig.shortcuts || []).slice(
					0,
					menuConfig.maxActions,
				);
				shortcuts.forEach(function (shortcut) {
					if (expressions.indexOf(shortcut.name) === -1) return;
					var button = createMenuButton(
						"live2d-companion-expression-" + shortcut.name,
						shortcut.label,
						shortcut.icon ||
							"material-symbols:face-retouching-natural-rounded",
						function () {
							requestCloseExpressionPanel();
							setCompanionExpression(shortcut.name);
						},
					);
					button.classList.add(
						"live2d-companion-expression-shortcut",
					);
					if (button.parentElement !== menu) {
						menu.appendChild(button);
					}
				});
			}

			function mountCompanionControls() {
				var menu = getWidgetMenu();
				if (!menu) return;
				menu.classList.add("live2d-companion-menu");
				menu.style.zIndex = "10002";
				menu.style.pointerEvents = "auto";
				var existing = document.getElementById(
					"live2d-companion-collapse",
				);
				if (existing) {
					if (existing.parentElement !== menu) {
						menu.appendChild(existing);
					}
					configureCollapseButton(existing);
				} else {
					var button = document.createElement("button");
					button.id = "live2d-companion-collapse";
					button.className = "live2d-companion-collapse";
					button.type = "button";
					configureCollapseButton(button);
					button.addEventListener("click", function () {
						parent.postMessage(
							{ type: "l2d-action", action: "collapse" },
							"*",
						);
					});
					menu.appendChild(button);
				}
				mountModelSwitchButton(menu);
				if (expressionsReady) {
					mountExpressionButtons(menu);
				}
				syncExpressionPanelState(expressionPanelOpen);
			}

			function isPointInsideViewport(point) {
				if (!point) return false;
				var x = Number(point.x);
				var y = Number(point.y);
				if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
				return !(
					x < 0 ||
					y < 0 ||
					x > window.innerWidth ||
					y > window.innerHeight
				);
			}

			function syncPointerState(point) {
				setPointerInsideCompanion(isPointInsideViewport(point));
			}

			async function destroyWidget() {
				if (!widgetInstance) return;
				stopIdlePlayback();
				modelLoaded = false;
				expressionsReady = false;
				availableExpressionsCache = [];
				var instance = widgetInstance;
				widgetInstance = null;
				try {
					await instance.destroy();
				} catch (err) {
					console.error("Failed to destroy Live2D widget:", err);
				}
			}

			function showCompanionMessage(text) {
				if (!text) return;
				var message = document.getElementById(
					"live2d-companion-message",
				);
				if (!message) {
					message = document.createElement("div");
					message.id = "live2d-companion-message";
					message.className = "live2d-companion-message";
					document.body.appendChild(message);
				}
				message.textContent = String(text);
				message.classList.add("is-visible");
				clearTimeout(messageTimer);
				messageTimer = setTimeout(function () {
					message.classList.remove("is-visible");
				}, 3500);
			}

			function setCompanionExpression(name, options) {
				if (!name || !widgetInstance || !widgetInstance.l2d) return;
				widgetInstance.l2d.setExpression(String(name));
				if (!options || options.resetIdleTimer !== false) {
					lastIdlePlaybackExpression = String(name);
					scheduleIdlePlayback();
				}
			}

			function setCompanionParameters(parameters) {
				if (!parameters || !widgetInstance || !widgetInstance.l2d)
					return;
				widgetInstance.l2d.setParams(parameters);
			}

			function waitForRenderFrames(count) {
				return new Promise(function (resolve) {
					var remaining = Math.max(1, count || 1);
					function tick() {
						remaining -= 1;
						if (remaining <= 0) {
							resolve();
							return;
						}
						requestAnimationFrame(tick);
					}
					requestAnimationFrame(tick);
				});
			}

			async function applyDefaultParametersBeforeReveal(config) {
				setCompanionParameters(getActiveDefaultParameters(config));
				await waitForRenderFrames(2);
			}

			function buildRuntimeWidgetConfig(config) {
				var widgetConfig = Object.assign({}, config);
				var models = getModelList(config);
				currentModelIndex = getStoredModelIndex(config);
				if (models.length) {
					widgetConfig.model = models.length > 1 ? models : models[0];
				}
				delete widgetConfig.ui;
				delete widgetConfig.theme;
				delete widgetConfig._models;
				delete widgetConfig._modelProfiles;
				delete widgetConfig._modelSwitch;
				delete widgetConfig._expressionMenu;
				delete widgetConfig._idlePlayback;
				return widgetConfig;
			}

			async function initializeCompanion(config, forceReload) {
				lastInitConfig = config;
				applyUi(config.ui);
				applyTheme(config.theme);
				var widgetConfig = buildRuntimeWidgetConfig(config);
				postActiveModelState();
				var configKey = JSON.stringify(widgetConfig);

				if (
					!forceReload &&
					widgetInstance &&
					activeConfigKey === configKey
				) {
					if (!modelLoaded) {
						observeWidgetUi();
						mountCompanionControls();
						hideAboutMenu();
						return;
					}
					observeWidgetUi();
					mountCompanionControls();
					await applyDefaultParametersBeforeReveal(config);
					expressionsReady = true;
					refreshAvailableExpressions();
					postAvailableExpressions();
					scheduleIdlePlayback();
					notifyLoaded();
					return;
				}

				if (!forceReload && loadingConfigKey === configKey) {
					return;
				}

				modelLoaded = false;
				expressionsReady = false;
				availableExpressionsCache = [];
				loadingConfigKey = configKey;
				if (widgetInstance) {
					await destroyWidget();
				}

				if (widgetConfig.menus) {
					widgetConfig.menus.items = [];
				}
				widgetConfig.primaryColor =
					"var(--live2d-companion-message-surface)";

				try {
					widgetInstance = L2D_WIDGET.createWidget(widgetConfig);
					activeConfigKey = configKey;
				} catch (err) {
					loadingConfigKey = "";
					activeConfigKey = "";
					console.error("Failed to initialize Live2D widget:", err);
					return;
				}
				loadingConfigKey = "";
				observeWidgetUi();
				mountCompanionControls();

				hideAboutMenu();

				var notified = false;
				var initialModelSwitchApplied = false;
				function notifyOnce() {
					if (notified) return;
					modelLoaded = true;
					if (
						!initialModelSwitchApplied &&
						currentModelIndex > 0 &&
						widgetInstance &&
						widgetInstance.switchModel
					) {
						initialModelSwitchApplied = true;
						widgetInstance
							.switchModel(currentModelIndex)
							.then(function () {
								notified = true;
								applyDefaultParametersBeforeReveal(config).then(
									function () {
										expressionsReady = true;
										refreshAvailableExpressions();
										mountCompanionControls();
										postAvailableExpressions();
										scheduleIdlePlayback();
										notifyLoaded();
									},
								);
							});
						return;
					}
					notified = true;
					applyDefaultParametersBeforeReveal(config).then(
						function () {
							expressionsReady = true;
							refreshAvailableExpressions();
							mountCompanionControls();
							postAvailableExpressions();
							scheduleIdlePlayback();
							notifyLoaded();
						},
					);
				}

				var checkInterval = setInterval(function () {
					var canvas = document.querySelector("canvas");
					if (canvas && canvas.width > 0 && canvas.height > 0) {
						mountCompanionControls();
						clearInterval(checkInterval);
					}
				}, 200);

				if (
					widgetInstance &&
					widgetInstance.l2d &&
					typeof widgetInstance.l2d.on === "function"
				) {
					widgetInstance.l2d.on("loaded", function () {
						setTimeout(notifyOnce, 0);
					});
				}

				setTimeout(function () {
					clearInterval(checkInterval);
					loadingConfigKey = "";
					if (!notified) {
						console.warn(
							"Live2D model loaded event did not fire before timeout.",
						);
						notifyLoaded();
					}
				}, 15000);
			}

			window.addEventListener("message", function (e) {
				if (e.data.type === "live2d-companion-theme") {
					applyTheme(e.data.theme);
					return;
				}

				if (e.data.type === "live2d-companion-command") {
					var command = e.data.command;
					if (!command) return;
					if (command.type === "message") {
						showCompanionMessage(command.text);
					}
					if (command.type === "expression") {
						setCompanionExpression(command.name);
					}
					return;
				}

				if (e.data.type === "live2d-companion-expression-panel-state") {
					syncExpressionPanelState(e.data.open);
					return;
				}

				if (e.data.type === "live2d-companion-sync-pointer") {
					syncPointerState(e.data.point);
					return;
				}

				if (e.data.type === "live2d-companion-drag-state") {
					dragging = e.data.dragging === true;
					document.body.classList.toggle(
						"live2d-companion-dragging",
						dragging,
					);
					return;
				}

				if (e.data.type !== "l2d-init") return;
				initializeCompanion(e.data.config, false);
			});
		</script>
	</body>
</html>
